query GetEmployees {
  getEmployees {
    id
    name
    age
  }
}

query EmployeeById($id: Int!) {
  employeeById(id: $id) {
    id
    name
    age
  }
}

mutation CreateEmployee($name: String!, $age: Int!) {
  createEmployee(name: $name, age: $age) {
    id
    name
    age
  }
}

subscription OnEmployeeCreated {
  onEmployeeCreated {
    id
    name
    age
  }
}
