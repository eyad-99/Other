apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernates-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernates-api
  template:
    metadata:
      labels:
        app: kubernates-api
    spec:
      containers:
        - name: kubernates-api
          image: kubernates-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kubernates-api-service
spec:
  type: NodePort
  selector:
    app: kubernates-api
  ports:
    - port: 90
      targetPort: 8080
      nodePort: 30080